name: Deploy frontend to GitHub Pages

# 说明：
#   * 把 main 分支里的 frontend/ 目录作为纯静态站点发布
#   * 首次运行会用 GITHUB_TOKEN 自动启用 Pages（enablement: true），
#     所以即使你在网页上点不到 Settings -> Pages，也能完成发布
#   * 之后每次改 frontend/ 都会自动重新部署

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages (first run also enables it)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site (frontend/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
